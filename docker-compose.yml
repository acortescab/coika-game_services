services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${COIKA_DATABASE_USER}
      POSTGRES_PASSWORD: ${COIKA_DATABASE_PASSWORD}
      POSTGRES_DB: ${COIKA_DATABASE_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      target: dev
    ports:
      - "8000:8001"
    volumes:
      - .:/app
    environment:
      COIKA_ENV: ${COIKA_ENV}
      # Inside the compose network the services are reached by name, not localhost
      COIKA_DATABASE_URL_READER: postgresql+asyncpg://${COIKA_DATABASE_USER}:${COIKA_DATABASE_PASSWORD}@postgres:5432/${COIKA_DATABASE_DB}
      COIKA_DATABASE_URL_WRITER: postgresql+asyncpg://${COIKA_DATABASE_USER}:${COIKA_DATABASE_PASSWORD}@postgres:5432/${COIKA_DATABASE_DB}
      COIKA_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
